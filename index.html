<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thinking Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Thinking Partner: clean study-tool design system.
   One typeface (Inter), one accent (mint green) on warm surfaces, neutral surfaces. Layout: your workspace on the left, the AI partner as a side panel on the right.
   The AI panel stays narrow until you have shared your own thinking. */
:root {
  --bg: #fbfaf6; --surface: #ffffff; --panel: #f5f3ec; --ink: #17231e; --text: #22302a; --mute: #5d6862; --faint: #8d968f;
  --line: #e7e4da; --line-strong: #d3cfc2;
  --primary: #12a37f; --primary-hover: #0d8466; --primary-soft: #e3f6ef; --primary-ink: #0b6b55;
  --ok: #15803d; --ok-soft: #e6f6ec; --warn: #b45309; --warn-soft: #fff4de; --bad: #b42318; --bad-soft: #fde9e7;
  /* compatibility names used by older rules and inline styles */
  --ai-bg: var(--panel); --ai-ink: var(--ink); --ai-mute: var(--mute); --ai-line: var(--line);
  --you-bg: var(--surface); --you-paper: var(--surface); --you-ink: var(--ink); --you-mute: var(--mute); --you-line: var(--line);
  --signal: var(--primary);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --hand: var(--font); --disp: var(--font); --mono: var(--font);
  --r: 12px; --r-lg: 16px; --r-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(23, 35, 30, .06), 0 1px 1px rgba(23, 35, 30, .04);
  --shadow: 0 4px 14px rgba(23, 35, 30, .08), 0 1px 3px rgba(23, 35, 30, .06);
  --ring: 0 0 0 3px rgba(18, 163, 127, .22);
  --ease: cubic-bezier(.65, 0, .25, 1); --ease-out: cubic-bezier(.2, .8, .2, 1); --pop: cubic-bezier(.2, .8, .2, 1);
  --top: 60px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono, .pane.you .mono { font-family: var(--font); }
.small { font-size: 13px; }
.muted, .pane.ai .muted { color: var(--mute); }

/* ---------- shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
header { height: var(--top); flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.mark { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font); font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; background: none; border: 0; padding: 0; color: var(--ink); text-align: left; justify-self: start; }
.mark::before { content: ""; width: 26px; height: 26px; flex: none; border-radius: 8px; background: var(--primary) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><circle cx='9' cy='10' r='2.4' fill='white'/><circle cx='17' cy='10' r='2.4' fill='white'/><path d='M8.5 16.5 Q13 20 17.5 16.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>") center/100% no-repeat; }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
.tools select, .tools button { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--text); box-shadow: none; transition: background .15s, border-color .15s; }
.tools select { padding-right: 6px; }
.tools button:hover, .tools select:hover { background: var(--bg); border-color: var(--line-strong); }
#homeBtn2, #logBtn { display: inline-flex; align-items: center; justify-content: center; padding: 0; width: 36px; }
#homeBtn2[hidden] { display: none; }
#homeTxt { display: none; }
.house { width: 20px; height: 20px; display: inline-block; vertical-align: -4px; }
.tools .house { width: 20px; height: 20px; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); font-size: 13px; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.demo::before { background: #d97706; }
.agency { display: flex; align-items: center; gap: 12px; color: var(--mute); }
.agency .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--line); position: relative; overflow: hidden; }
.agency .bar i { position: absolute; inset: 0 auto 0 0; width: var(--ai); background: var(--primary); border-radius: 999px; transition: width .8s var(--ease); }
.who { min-width: 5.5em; color: var(--primary-ink); font-weight: 600; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1px var(--ai); transition: grid-template-columns .8s var(--ease), grid-template-rows .8s var(--ease); }
.pane.you { order: 1; } .split { order: 2; } .pane.ai { order: 3; }
.split { background: var(--line); }
.pane { position: relative; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.pane.you { background: var(--surface); }
.pane.ai { background: var(--panel); color: var(--ink); }
.pane-body { display: flow-root; position: relative; z-index: 1; padding: clamp(28px, 5vh, 56px) max(20px, calc(env(safe-area-inset-right, 0px) + clamp(8px, 3vw, 44px))) clamp(36px, 5vh, 60px) max(20px, calc(env(safe-area-inset-left, 0px) + clamp(8px, 3vw, 44px))); max-width: 760px; margin: 0 auto; }
.pane-body.wide { max-width: 1080px; }
.idle { display: flow-root; position: relative; z-index: 1; padding: clamp(28px, 5vh, 56px) 28px; max-width: 760px; margin: 0 auto; }
.idle p { margin: 12px 0 0; font-size: 14px; color: var(--mute); }
.pane.ai .pane-body, .pane.ai .idle { transition: opacity .35s ease; }
.pane.ai[data-open="false"] .pane-body, .pane.ai[data-open="false"] .idle { opacity: 0; pointer-events: none; }
.pane.ai[data-open="true"] .pane-body, .pane.ai[data-open="true"] .idle { transition-delay: .4s; }
.rail { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--faint); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.pane.ai[data-open="false"] .rail { opacity: 1; writing-mode: vertical-rl; transition-delay: .4s; }

/* ---------- avatars (replace the characters) ---------- */
.char { position: absolute; top: clamp(24px, 4.6vh, 50px); right: max(20px, calc(env(safe-area-inset-right, 0px) + clamp(8px, 3vw, 44px))); width: 40px; height: 40px; pointer-events: none; z-index: 2; }
.char svg { width: 100%; height: 100%; display: block; }
.ch .talk-mouth { transform-box: fill-box; transform-origin: center; animation: talk .3s ease-in-out infinite alternate; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.ch .arc { opacity: 0; animation: arc 1s ease-out infinite; }
.ch .arc2 { animation-delay: .3s; }
@keyframes arc { 0% { opacity: 0; transform: translateX(-2px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateX(3px); } }
.ch .dots circle { animation: dot 1.2s ease-in-out infinite; }
.ch .dots circle:nth-child(2) { animation-delay: .2s; } .ch .dots circle:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.ch .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.char.swap { animation: swapPop .35s var(--ease-out); }
@keyframes swapPop { from { transform: scale(.9); opacity: .6; } }

/* keep text clear of the avatar */
.pane-body > .humantext, .pane-body > h1, .pane-body > h2, .pane-body > blockquote, .pane-body > .kicker { padding-right: 52px; }
.pane-body > blockquote { padding-right: 52px; }

/* AI status row (top of the AI panel) */
.botbar { display: flex; align-items: center; gap: 10px; margin: 0 0 clamp(14px, 2.6vh, 26px); min-height: 40px; padding-right: 52px; color: var(--ink); font-size: 14px; font-weight: 600; }
.lamp { width: 9px; height: 9px; border-radius: 50%; background: #a0a79f; flex: none; }
.lamp.lp-think { background: var(--primary); animation: lampPulse 1s ease-in-out infinite; }
.lamp.lp-talk, .lamp.lp-happy { background: #16a34a; }
.lamp.lp-meh { background: #d97706; }
.lamp.lp-ask, .lamp.lp-listen { background: #0b6b55; animation: lampPulse 1.4s ease-in-out infinite; }
@keyframes lampPulse { 50% { opacity: .35; } }
.botbar .bst { font-weight: 500; color: var(--mute); }
.bchips { display: none; }

/* ---------- type ---------- */
.kicker { font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: .01em; text-transform: none; color: var(--primary-hover); margin: 0 0 10px; }
.pane.ai .kicker, .pane.you .kicker { font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--primary-hover); }
h1, h2 { font-family: var(--font); font-weight: 700; margin: 0; text-wrap: balance; color: var(--ink); letter-spacing: -.02em; }
h1 { font-size: clamp(30px, min(4.4vw, 7vh), 52px); line-height: 1.1; letter-spacing: -.03em; }
h2, .pane.ai h2 { font-family: var(--font); font-size: clamp(22px, min(2.8vw, 4.4vh), 30px); line-height: 1.22; font-weight: 650; }
h2.q2 { font-size: clamp(22px, 3.4vh, 28px); line-height: 1.25; }
.scribble { display: none; }
.lead, .pane.ai .lead { font-family: var(--font); font-size: 17px; line-height: 1.5; color: var(--mute); margin: 12px 0 0; max-width: 34em; }
label.q { display: block; font-weight: 600; font-size: 17px; margin: 24px 0 8px; color: var(--ink); }
blockquote { margin: 18px 0 0; padding: 12px 16px; border-left: 3px solid var(--primary); border-radius: 0 var(--r-sm) var(--r-sm) 0; background: var(--primary-soft); font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; color: var(--ink); }
.aitext { font-family: var(--font); font-size: 16px; line-height: 1.65; margin: 0 0 18px; color: var(--text); }
.aitext.big { font-size: 17px; line-height: 1.65; }
.humantext { font-size: 19px; line-height: 1.55; margin: 0 0 22px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.notes-echo { white-space: pre-wrap; font-size: 15px; overflow-wrap: anywhere; color: var(--mute); }
.pane.ai a, .srclist a { color: var(--primary-ink); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; overflow-wrap: anywhere; }

/* ---------- inputs and buttons ---------- */
textarea, .ask { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
textarea { width: 100%; min-height: 168px; padding: 14px 16px; resize: vertical; font-size: 16px; line-height: 1.55; font-family: var(--font); color: var(--ink); }
textarea::placeholder, .ask input::placeholder { color: var(--faint); }
textarea:focus, .ask:focus-within { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
#notes { min-height: 140px; }
textarea.short { min-height: 92px; }
textarea:disabled { opacity: .55; cursor: not-allowed; background: var(--bg); }
.ask { display: flex; align-items: center; margin: 26px 0 0; max-width: 740px; padding: 6px 6px 6px 18px; border-radius: 14px; box-shadow: var(--shadow); }
.ask input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; font-size: 18px; font-family: var(--font); }
.actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
button.primary, button.secondary, button.ghost { border-radius: 10px; font-family: var(--font); font-weight: 600; font-size: 15px; line-height: 1.2; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s; }
button.primary, button.secondary { padding: 11px 20px; letter-spacing: 0; }
button.primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 1px 2px rgba(18, 163, 127, .35); }
button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm); }
button.secondary:hover:not(:disabled) { background: var(--bg); border-color: var(--faint); }
button.ghost { background: transparent; color: var(--primary-ink); border: 1px solid var(--line-strong); padding: 8px 14px; font-size: 14px; }
button.ghost:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); }
button.primary:active:not(:disabled), button.secondary:active:not(:disabled), button.ghost:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.preset { margin-top: 22px; max-width: 740px; }
.preset .small { margin: 0 0 10px; color: var(--mute); font-size: 14px; }
.preset .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preset button, .method { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, background .15s; }
.preset button { padding: 11px 14px; font-size: 15px; line-height: 1.35; color: var(--text); }
.preset button:hover, .method:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); box-shadow: var(--shadow-sm); }
.refresh { margin-top: 10px; }
aside.err { margin-top: 14px; padding: 10px 14px; border: 1px solid #f3b8b2; border-radius: var(--r-sm); background: var(--bad-soft); color: var(--bad); font-size: 14px; overflow-wrap: anywhere; }

/* ---------- audio ---------- */
.voice { position: relative; display: block; width: 100%; margin: 22px 0 14px; padding: 26px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.voice:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.voice .glyph { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.voice .glyph svg { width: 52px; height: 52px; padding: 15px; background: var(--primary); border-radius: 50%; fill: #fff; box-shadow: 0 4px 12px rgba(18, 163, 127, .35); }
.wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 80px; }
.wave i { flex: none; width: 4px; height: calc(var(--h) * 1px); background: var(--primary); border-radius: 4px; opacity: .45; transform: scaleY(.3); transition: opacity .3s; }
.wave.playing i { opacity: .9; animation: pulse 1s ease-in-out infinite; animation-delay: calc(var(--i) * -70ms); }
.wave.loading i { animation: scan 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * 45ms); }
@keyframes pulse { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
@keyframes scan { 0%, 100% { transform: scaleY(.15); opacity: .3; } 40% { transform: scaleY(.7); opacity: .9; } }
.idle .wave { height: 40px; }
.idle .wave i { height: calc(var(--h) * .4px); }

/* ---------- score ---------- */
.score { display: grid; gap: 10px; padding: 16px 18px 18px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); clear: both; }
.score strong { font-weight: 700; font-size: clamp(22px, 3vh, 28px); line-height: 1.15; letter-spacing: -.02em; }
.scale { position: relative; height: 8px; border-radius: 999px; background: var(--line); }
.scale i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width 1s var(--ease) .5s; }
.scale b { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 2px; background: var(--ink); }
.draft { padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); user-select: text; }
.sumblock { margin-bottom: 6px; }

/* ---------- dialogs ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(23, 35, 30, .45); padding: 16px; }
.sheet[hidden] { display: none; }
.sheet > div { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: 0 24px 60px rgba(23, 35, 30, .3); }
.sheet h3 { margin: 0 0 8px; font-family: var(--font); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.sheet p { margin: 0 0 14px; color: var(--mute); font-size: 15px; line-height: 1.5; }
.sheet input { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: #fff; padding: 10px 12px; font-size: 14px; }
.sheet input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.sheet button { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 9px 16px; font-size: 14px; font-weight: 600; }
.sheet button:hover { background: var(--bg); }
.sheet button.go { background: var(--primary); border-color: var(--primary); color: #fff; }
.sheet button.go:hover { background: var(--primary-hover); }

/* ---------- features ---------- */
.entry { margin-top: 22px; }
.composer { position: relative; clear: both; }
.composer textarea { display: block; min-height: 140px; padding-right: 110px; }
.mic { position: absolute; right: 10px; top: 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); padding: 6px 12px; font-size: 14px; font-weight: 600; box-shadow: none; }
.mic:hover { background: var(--primary-soft); border-color: var(--primary); }
.mic.on { background: var(--bad-soft); border-color: #f3b8b2; color: var(--bad); animation: rec 1.1s ease-in-out infinite; }
@keyframes rec { 50% { opacity: .65; } }
details.hist { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
details.hist summary { font-size: 14px; font-weight: 600; cursor: pointer; color: var(--mute); }
.turn { margin: 12px 0; line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; }
.turn b { display: inline-block; min-width: 3.4em; color: var(--primary-ink); font-weight: 600; }
.turn.ai { color: var(--text); }
.right { text-align: right; margin: 8px 0 0; }
.map { margin: 4px 0 14px; }
.map svg { width: 100%; height: auto; display: block; }
.mmhit { fill: rgba(255, 255, 255, .001); cursor: pointer; transition: fill .15s ease; }
.mmhit:hover { fill: rgba(18, 163, 127, .1); }
.mmleg { margin: 0 0 8px; color: var(--mute); }
.mmin { display: grid; gap: 10px; margin: 20px 0 0; }
.mm-in { display: flex; align-items: center; gap: 12px; }
.mm-in b { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); font-size: 14px; font-weight: 700; }
.mm-in input { flex: 1; min-width: 0; padding: 10px 14px; font-size: 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); }
.mm-in input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.mmpick { margin: 14px 0 10px; font-size: 15px; font-weight: 600; color: var(--faint); }
.mmpick.on { color: var(--primary-ink); }
.methods { display: grid; gap: 12px; margin-top: 22px; }
.method { display: grid; gap: 2px; padding: 14px 18px; }
.method b { font-family: var(--font); font-weight: 650; font-size: 17px; line-height: 1.25; color: var(--ink); }
.method span:last-child { color: var(--mute); font-size: 15px; line-height: 1.4; }
.method .tag { min-height: 1.2em; color: var(--primary-hover); font-weight: 600; font-size: 12px; letter-spacing: .02em; }
.method.rec { background: var(--primary-soft); border-color: #a8e2cf; }
.method:disabled { opacity: .5; cursor: wait; }
.entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 22px; }
.entries button { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; }
.entries button b { font-size: 15px; font-weight: 650; }
.entries button span { font-size: 13px; font-weight: 400; color: var(--mute); line-height: 1.35; }
.assign { border: 1px solid #a8e2cf; border-radius: var(--r); background: var(--primary-soft); padding: 12px 16px; margin: 16px 0 0; }
.assign p { margin: 4px 0; }
.linkbox { width: 100%; font-size: 13px; }

/* ---------- record / notebook ---------- */
.logitem { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin: 6px 0; font-size: 15px; color: var(--ink); }
.logitem:hover { background: var(--primary-soft); border-color: var(--primary); }
.logitem em { font-style: normal; font-size: 13px; color: var(--mute); white-space: nowrap; }
.logitem b { white-space: nowrap; }
.recpaper h3.ok { color: var(--ok); } .recpaper h3.no { color: var(--warn); }
.srclist { margin: 8px 0 12px; padding-left: 22px; }
.srclist li { margin-bottom: 9px; font-size: 15px; line-height: 1.4; }
.srclist .why { font-size: 13px; color: var(--mute); }
.vbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

/* ---------- thinking-first ledger ---------- */

  if (parts.length <= 1) return parts.length ? parts : [t];

$("gBack").addEventListener("click", () => { if (gI > 0) { gI--; guideRender(); } });
$("gNext").addEventListener("click", () => { if (gI < GUIDE.en.pages.length - 1) { gI++; guideRender(); } else guideClose(); });
$("guide").addEventListener("click", (e) => { if (e.target === $("guide")) guideClose(); });
document.addEventListener("keydown", (e) => { if ($("guide").hidden) return; if (e.key === "Escape") guideClose(); else if (e.key === "ArrowRight") $("gNext").click(); else if (e.key === "ArrowLeft") $("gBack").click(); });
document.addEventListener("click", (e) => { if (e.target.closest && e.target.closest("[data-act=guide]")) guideOpen(0); });
(() => { let seen = false; try { seen = localStorage.getItem("htw_guide") === "1"; } catch (er) {} if (!seen && !navigator.webdriver) setTimeout(() => guideOpen(0), 500); })();

render();
</script>

</body>
</html>
